// ===== MESSAGE FORMATTING WITH CLICKABLE LINKS - MOBILE OPTIMIZED =====
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function formatText(text) {
    // First, escape HTML to prevent XSS
    let html = escapeHtml(text);
    
    // Apply formatting (bold, italic, underline)
    html = html.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
    html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
    html = html.replace(/_{2}([^_{]+)_{2}/g, '<u>$1</u>');
    
    // ===== CONVERT URLs TO CLICKABLE LINKS =====
    // Split by spaces and newlines
    const parts = html.split(/(\s+)/);
    
    for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        
        // Skip if already a link
        if (part.includes('href=')) continue;
        
        let url = null;
        let isUrl = false;
        let displayUrl = part;
        
        // Check for http:// or https://
        if (part.match(/^https?:\/\/[^\s<>"']+$/)) {
            url = part;
            isUrl = true;
        }
        // Check for www.
        else if (part.match(/^www\.[^\s<>"']+$/)) {
            url = 'https://' + part;
            isUrl = true;
        }
        
        if (isUrl && url) {
            // Truncate long URLs for display
            if (displayUrl.length > 40) {
                displayUrl = displayUrl.substring(0, 37) + '...';
            }
            // Mobile-friendly: larger tap target, open in external browser
            parts[i] = `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: #0e94e1; text-decoration: underline; word-break: break-all; padding: 2px 0; display: inline-block;">${displayUrl}</a>`;
        }
    }
    
    html = parts.join('');
    
    // Convert newlines to <br>
    html = html.replace(/\n/g, '<br>');
    
    // Preserve multiple spaces
    html = html.replace(/ {2,}/g, function(match) {
        return '&nbsp;'.repeat(match.length);
    });
    
    return html;
}

        // ===== WHATSAPP SHARE =====
        function shareToWhatsApp(text) {
            const encodedText = encodeURIComponent(text);
            const whatsappAppUrl = `whatsapp://send?text=${encodedText}`;
            const whatsappWebUrl = `https://wa.me/?text=${encodedText}`;

            const user = firebase.auth().currentUser;
            if (!user) {
                showToast('Please wait... authenticating');
                firebase.auth().signInAnonymously()
                    .then(() => {
                        sendMessage();
                    })
                    .catch(error => {
                        console.error('Auth error:', error);
                        showToast('Authentication failed');
                    });
                return;
            }

            // Use the actual user's full name from the database
            const senderName = currentUser.name;

            // Disable send button while sending
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            db.collection('chatMessages').add({
                text: text,
                userId: user.uid,
                senderName: senderName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                chatInput.value = '';
                chatInput.style.height = 'auto';
                showToast('Message sent!');
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            }).catch((error) => {
                console.error('Error sending message:', error);
                showToast('Error sending message');
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send';
            });
        }

        // ===== RENDER MESSAGES =====
        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No messages yet</p>
                    </div>
                `;
                messageCount.textContent = '0';
                return;
            }

            const sorted = [...messages].sort((a, b) => 
                (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0)
            );

            let html = '';
            sorted.forEach(msg => {
                const isSelf = msg.userId === firebase.auth().currentUser?.uid;
                const timeStr = msg.timestamp?.toDate?.()?.toLocaleTimeString([], { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                }) || '';
                const formattedText = formatText(msg.text);
                const rawText = msg.text || '';

                html += `
                    <div class="message-bubble ${isSelf ? 'self' : ''}" data-id="${msg.id}">
                        <div class="msg-header">
                            <span class="msg-user">${msg.senderName || 'User'}</span>
                            <span class="msg-time">${timeStr}</span>
                        </div>
                        <div class="msg-text">${formattedText}</div>
                        <div class="msg-actions">
                            <button class="copy-btn" data-text="${escapeHtml(rawText)}" title="Copy message">
                                <i class="fas fa-copy"></i> <p>Copy</p>
                            </button>
                            <button class="whatsapp-btn" data-text="${escapeHtml(rawText)}" title="Send to WhatsApp">
                                <i class="fab fa-whatsapp"></i> <p>WhatsApp</p>
                            </button>
                        </div>
                    </div>
                `;
            });

            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            messageCount.textContent = sorted.length;

            // Copy buttons
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const text = btn.dataset.text;
                    if (text) {
                        navigator.clipboard?.writeText(text).then(() => {
                            showToast('Copied!');
                        }).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            showToast('Copied!');
                        });
                    }
                });
            });

            // WhatsApp buttons
            document.querySelectorAll('.whatsapp-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const text = btn.dataset.text;
                    if (text) {
                        shareToWhatsApp(text);
                    }
                });
            });
        }

        // ===== LISTEN TO MESSAGES =====
        function listenMessages() {
            if (unsubscribe) {
                unsubscribe();
            }

            unsubscribe = db.collection('chatMessages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    const msgs = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        msgs.push({ id: doc.id, ...data });
                    });
                    allMessages = msgs;
                    renderMessages(msgs);
                }, error => {
                    console.error('Chat error:', error);
                    messagesContainer.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color:#d74f4f;"></i>
                            <p>Error loading messages</p>
                        </div>
                    `;
                });
        }

        // ===== AUTO-RESIZE TEXTAREA =====
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ===== LOGIN =====
        function login() {
            const id = idInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!id || !password) {
                loginError.textContent = 'Please enter both ID and password';
                loginError.classList.add('show');
                setTimeout(() => loginError.classList.remove('show'), 3000);
                return;
            }

            const result = authenticateUser(id, password);
            
            if (result.success) {
                currentUser = result.user;
                loginError.classList.remove('show');
                loginScreen.classList.add('hidden');
                chatScreen.classList.add('open');
                isLoggedIn = true;
                
                // Update header with user's name
                chatUserDisplay.textContent = `👤 ${currentUser.name}`;
                
                firebase.auth().signInAnonymously()
                    .then(() => {
                        listenMessages();
                        sessionStorage.setItem('DoghriChatLoggedIn', 'true');
                        sessionStorage.setItem('DoghriChatUserId', id);
                        sessionStorage.setItem('DoghriChatUserName', currentUser.name);
                    })
                    .catch(error => {
                        console.error('Auth error:', error);
                        listenMessages();
                    });
            } else {
                loginError.textContent = 'Invalid ID or password. Please try again.';
                loginError.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => {
                    loginError.classList.remove('show');
                }, 3000);
            }
        }

        // ===== LOGOUT =====
        function logout() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            isLoggedIn = false;
            currentUser = null;
            firebase.auth().signOut().catch(() => {});
            chatScreen.classList.remove('open');
            loginScreen.classList.remove('hidden');
            idInput.value = '';
            passwordInput.value = '';
            chatUserDisplay.textContent = 'Doghri Chat Mobile';
            messagesContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>Loading messages...</p>
                </div>
            `;
            allMessages = [];
            messageCount.textContent = '0';
            sessionStorage.removeItem('DoghriChatLoggedIn');
            sessionStorage.removeItem('DoghriChatUserId');
            sessionStorage.removeItem('DoghriChatUserName');
        }

        // ===== EVENT LISTENERS =====
        loginBtn.addEventListener('click', login);
        
        // Enter key on either input triggers login
        idInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });
        
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        logoutBtn.addEventListener('click', logout);
        refreshBtn.addEventListener('click', () => {
            if (unsubscribe) {
                unsubscribe();
                listenMessages();
                showToast('Refreshed');
            }
        });

        // Send message events
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-login if session exists
        const savedUserId = sessionStorage.getItem('DoghriChatUserId');
        const savedUserName = sessionStorage.getItem('DoghriChatUserName');
        
        if (sessionStorage.getItem('DoghriChatLoggedIn') === 'true' && savedUserId) {
            // Find the user in the list
            const savedUser = USERS.find(u => u.id === parseInt(savedUserId));
            if (savedUser) {
                currentUser = savedUser;
                loginScreen.classList.add('hidden');
                chatScreen.classList.add('open');
                isLoggedIn = true;
                chatUserDisplay.textContent = `👤 ${currentUser.name}`;
                
                firebase.auth().signInAnonymously()
                    .then(() => {
                        listenMessages();
                    })
                    .catch(() => {
                        listenMessages();
                    });
            } else {
                // Invalid session, clear it
                sessionStorage.removeItem('DoghriChatLoggedIn');
                sessionStorage.removeItem('DoghriChatUserId');
                sessionStorage.removeItem('DoghriChatUserName');
            }
        }

        console.log('🚀 Doghri Chat Mobile loaded with ' + USERS.length + ' users');
    </script>
</body>
</html>
