<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOHR Chat · Mobile</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        #loginScreen {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 24px;
            padding: 2rem 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid #dee2e6;
            display: block;
        }
        
        #loginScreen.hidden {
            display: none;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header .logo {
            width: 72px;
            height: 72px;
            background: #0e94e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2.2rem;
            color: white;
        }
        
        .login-header h1 {
            color: #0e94e1;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .login-header p {
            color: #6c757d;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        
        .login-form .form-group {
            margin-bottom: 1.2rem;
        }
        
        .login-form label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #333;
            margin-bottom: 6px;
        }
        
        .login-form input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 2px solid #dee2e6;
            font-size: 1rem;
            background: #f8f9fa;
            transition: 0.2s;
            color: #333;
        }
        
        .login-form input:focus {
            outline: none;
            border-color: #0e94e1;
            box-shadow: 0 0 0 3px rgba(14, 148, 225, 0.1);
        }
        
        .login-form .login-error {
            color: #d74f4f;
            font-size: 0.8rem;
            margin-top: 6px;
            display: none;
        }
        
        .login-form .login-error.show {
            display: block;
        }
        
        .login-form button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 12px;
            background: #0e94e1;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.4rem;
        }
        
        .login-form button:hover {
            background: #0a70ab;
            transform: translateY(-1px);
        }
        
        .login-form button:active {
            transform: scale(0.97);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
            padding-top: 1rem;
        }
        
        #chatScreen {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid #dee2e6;
            display: none;
            flex-direction: column;
            overflow: hidden;
            max-height: 95vh;
            height: 95vh;
        }
        
        #chatScreen.open {
            display: flex;
        }
        
        .chat-header {
            padding: 0.8rem 1rem;
            background: #0e94e1;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        
        .chat-header .left i {
            font-size: 1.2rem;
        }
        
        .chat-header .left h2 {
            font-size: 1rem;
            font-weight: 600;
        }
        
        .chat-header .right {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        
        .chat-header .right button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.3rem 0.5rem;
            border-radius: 30px;
            transition: 0.15s;
        }
        
        .chat-header .right button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        .chat-header .right .logout-btn {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .chat-header .right .logout-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        
        .chat-messages {
            flex: 1;
            padding: 0.8rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #f8f9fa;
        }
        
        .chat-messages .empty-state {
            text-align: center;
            padding: 2rem 0;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .chat-messages .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.6rem;
            opacity: 0.5;
        }
        
        .message-bubble {
            background: #e9edf2;
            padding: 0.6rem 0.9rem;
            border-radius: 14px;
            max-width: 92%;
            word-break: break-word;
            font-size: 0.8rem;
            align-self: flex-start;
            line-height: 1.5;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace, system-ui;
            color: #333333;
            position: relative;
        }
        
        .message-bubble.self {
            align-self: flex-end;
            background: #0a70ab;
            color: #ffffff;
        }
        
        .message-bubble .msg-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            width: 100%;
        }
        
        .message-bubble .msg-user {
            font-weight: 600;
            font-size: 0.6rem;
            opacity: 0.7;
        }
        
        .message-bubble .msg-time {
            font-size: 0.5rem;
            opacity: 0.5;
        }
        
        .message-bubble .msg-text {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            font-size: 0.8rem;
        }
        
        .message-bubble .msg-text b,
        .message-bubble .msg-text strong {
            font-weight: 700;
        }
        
        .message-bubble .msg-text i,
        .message-bubble .msg-text em {
            font-style: italic;
        }
        
        .message-bubble .msg-text u {
            text-decoration: underline;
        }
        
        .msg-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(0, 0, 0, 0.06);
        }
        
        .message-bubble.self .msg-actions {
            border-top-color: rgba(255, 255, 255, 0.1);
        }
        
        .msg-actions button {
            background: transparent;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            color: #6c757d;
            transition: 0.15s;
        }
        
        .msg-actions button:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        .msg-actions button:active {
            transform: scale(0.95);
        }
        
        .message-bubble.self .msg-actions button {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .message-bubble.self .msg-actions button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .msg-actions .copy-btn {
            color: #0e94e1;
        }
        
        .message-bubble.self .msg-actions .copy-btn {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .msg-actions .whatsapp-btn {
            color: #25D366;
        }
        
        .message-bubble.self .msg-actions .whatsapp-btn {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .msg-actions .whatsapp-btn:hover {
            background: rgba(37, 211, 102, 0.1);
        }
        
        .message-bubble.self .msg-actions .whatsapp-btn:hover {
            background: rgba(37, 211, 102, 0.2);
        }
        
        .copy-toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.25s;
            z-index: 999;
            pointer-events: none;
        }
        
        .copy-toast.show {
            opacity: 1;
        }
        
        .chat-footer {
            padding: 0.6rem;
            background: #ffffff;
            border-top: 1px solid #dee2e6;
            flex-shrink: 0;
            text-align: center;
        }
        
        .chat-footer .reset-info {
            font-size: 0.6rem;
            color: #6c757d;
            opacity: 0.6;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #dee2e6;
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        @media (max-width: 480px) {
            #loginScreen {
                padding: 1.5rem 1rem;
            }
            #chatScreen {
                border-radius: 16px;
                max-height: 98vh;
                height: 98vh;
            }
            .message-bubble {
                max-width: 95%;
                font-size: 0.75rem;
            }
            .msg-actions button {
                font-size: 0.6rem;
                padding: 3px 6px;
            }
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-comment-dots"></i>
            </div>
            <h1>ZOHR Chat</h1>
            <p>Access your messages on mobile</p>
        </div>
        <form class="login-form" id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="passwordInput"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off">
            </div>
            <div class="login-error" id="loginError">Incorrect password. Please try again.</div>
            <button type="button" id="loginBtn"><i class="fas fa-unlock-alt"></i> Unlock Chat</button>
        </form>
        <div class="login-footer">
            <i class="fas fa-shield-alt"></i> Secure access · ZOHR Laboratory
        </div>
    </div>

    <div id="chatScreen">
        <div class="chat-header">
            <div class="left">
                <i class="fas fa-comment-dots"></i>
                <h2>ZOHR Chat</h2>
            </div>
            <div class="right">
                <button id="refreshBtn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>Loading messages...</p>
            </div>
        </div>
        <div class="chat-footer">
            <span class="reset-info">⏰ Resets at 7:20 AM &amp; 7:20 PM · <span id="messageCount">0</span> messages</span>
        </div>
    </div>

    <div class="copy-toast" id="copyToast">Copied!</div>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>

    <script>
        // ===== CONFIGURATION =====
        // Fetch config from server (Netlify function)
        let FIREBASE_CONFIG = null;
        let PASSWORD_HASH = null;
        let IS_CONFIG_LOADED = false;

        async function loadConfig() {
            try {
                const response = await fetch('/.netlify/functions/config');
                if (!response.ok) {
                    throw new Error('Failed to load config');
                }
                const data = await response.json();
                FIREBASE_CONFIG = data.firebaseConfig;
                PASSWORD_HASH = data.passwordHash;
                IS_CONFIG_LOADED = true;
                return true;
            } catch (error) {
                console.error('Error loading config:', error);
                // Fallback for local development - NEVER commit real credentials
                if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    console.warn('⚠️ Using development config. Do NOT commit real credentials!');
                    // Use environment variables from .env file or process.env
                    FIREBASE_CONFIG = {
                        apiKey: process.env.FIREBASE_API_KEY || 'dev-key',
                        authDomain: process.env.FIREBASE_AUTH_DOMAIN || 'localhost',
                        projectId: process.env.FIREBASE_PROJECT_ID || 'dev-project'
                    };
                    PASSWORD_HASH = process.env.CHAT_PASSWORD_HASH || 'dev-hash';
                    IS_CONFIG_LOADED = true;
                    return true;
                }
                return false;
            }
        }

        // ===== HASH PASSWORD =====
        async function hashPassword(password) {
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ===== MAIN APP =====
        let allMessages = [];
        let toastTimer = null;
        let unsubscribe = null;
        let isLoggedIn = false;

        // DOM refs
        const loginScreen = document.getElementById('loginScreen');
        const chatScreen = document.getElementById('chatScreen');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const messagesContainer = document.getElementById('chatMessages');
        const copyToast = document.getElementById('copyToast');
        const messageCount = document.getElementById('messageCount');

        function showToast(text) {
            copyToast.textContent = text;
            copyToast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                copyToast.classList.remove('show');
            }, 1800);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatText(text) {
            let html = escapeHtml(text);
            html = html.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
            html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
            html = html.replace(/_{2}([^_{]+)_{2}/g, '<u>$1</u>');
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/ {2,}/g, match => '&nbsp;'.repeat(match.length));
            return html;
        }

        function shareToWhatsApp(text) {
            const encodedText = encodeURIComponent(text);
            const whatsappAppUrl = `whatsapp://send?text=${encodedText}`;
            const whatsappWebUrl = `https://wa.me/?text=${encodedText}`;
            
            const win = window.open(whatsappAppUrl, '_blank');
            if (!win || win.closed || typeof win.closed === 'undefined') {
                setTimeout(() => {
                    window.open(whatsappWebUrl, '_blank');
                }, 300);
            }
        }

        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No messages yet</p>
                    </div>
                `;
                messageCount.textContent = '0';
                return;
            }

            const sorted = [...messages].sort((a, b) => 
                (a.timestamp?.toMillis?.() || 0) - (b.timestamp?.toMillis?.() || 0)
            );

            let html = '';
            sorted.forEach(msg => {
                const isSelf = msg.userId === firebase.auth().currentUser?.uid;
                const timeStr = msg.timestamp?.toDate?.()?.toLocaleTimeString([], { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                }) || '';
                const formattedText = formatText(msg.text);
                const rawText = msg.text || '';

                html += `
                    <div class="message-bubble ${isSelf ? 'self' : ''}" data-id="${msg.id}">
                        <div class="msg-header">
                            <span class="msg-user">${msg.senderName || 'User'}</span>
                            <span class="msg-time">${timeStr}</span>
                        </div>
                        <div class="msg-text">${formattedText}</div>
                        <div class="msg-actions">
                            <button class="copy-btn" data-text="${escapeHtml(rawText)}" title="Copy message">
                                <i class="fas fa-copy"></i> Copy
                            </button>
                            <button class="whatsapp-btn" data-text="${escapeHtml(rawText)}" title="Send to WhatsApp">
                                <i class="fab fa-whatsapp"></i> WhatsApp
                            </button>
                        </div>
                    </div>
                `;
            });

            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            messageCount.textContent = sorted.length;

            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const text = btn.dataset.text;
                    if (text) {
                        navigator.clipboard?.writeText(text).then(() => {
                            showToast('Copied!');
                        }).catch(() => {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            showToast('Copied!');
                        });
                    }
                });
            });

            document.querySelectorAll('.whatsapp-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const text = btn.dataset.text;
                    if (text) {
                        shareToWhatsApp(text);
                    }
                });
            });
        }

        // ===== LISTEN TO MESSAGES USING API =====
        async function fetchMessages() {
            try {
                const user = firebase.auth().currentUser;
                if (!user) return [];

                const token = await user.getIdToken();
                const response = await fetch('/.netlify/functions/chat', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch messages');
                }

                const data = await response.json();
                return data.messages || [];
            } catch (error) {
                console.error('Error fetching messages:', error);
                return [];
            }
        }

        async function sendMessageViaAPI(text, senderName) {
            try {
                const user = firebase.auth().currentUser;
                if (!user) throw new Error('Not authenticated');

                const token = await user.getIdToken();
                const response = await fetch('/.netlify/functions/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text, senderName })
                });

                if (!response.ok) {
                    throw new Error('Failed to send message');
                }

                return await response.json();
            } catch (error) {
                console.error('Error sending message:', error);
                throw error;
            }
        }

        async function deleteMessageViaAPI(messageId) {
            try {
                const user = firebase.auth().currentUser;
                if (!user) throw new Error('Not authenticated');

                const token = await user.getIdToken();
                const response = await fetch(`/.netlify/functions/chat?id=${messageId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to delete message');
                }

                return await response.json();
            } catch (error) {
                console.error('Error deleting message:', error);
                throw error;
            }
        }

        // ===== LISTEN FOR REAL-TIME UPDATES =====
        function listenMessages() {
            if (unsubscribe) {
                unsubscribe();
            }

            // Poll for updates every 5 seconds (since we're using API)
            const interval = setInterval(async () => {
                if (!isLoggedIn) {
                    clearInterval(interval);
                    return;
                }
                try {
                    const messages = await fetchMessages();
                    allMessages = messages;
                    renderMessages(messages);
                } catch (error) {
                    console.error('Error polling messages:', error);
                }
            }, 3000);

            unsubscribe = () => {
                clearInterval(interval);
            };

            // Initial fetch
            fetchMessages().then(messages => {
                allMessages = messages;
                renderMessages(messages);
            });
        }

        // ===== LOGIN =====
        async function login() {
            const password = passwordInput.value.trim();
            const hashed = await hashPassword(password);
            
            if (hashed === PASSWORD_HASH) {
                loginError.classList.remove('show');
                loginScreen.classList.add('hidden');
                chatScreen.classList.add('open');
                isLoggedIn = true;

                try {
                    await firebase.auth().signInAnonymously();
                    listenMessages();
                    sessionStorage.setItem('zohrChatLoggedIn', 'true');
                } catch (error) {
                    console.error('Auth error:', error);
                    // Show error but still allow access
                    listenMessages();
                }
            } else {
                loginError.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => {
                    loginError.classList.remove('show');
                }, 3000);
            }
        }

        // ===== LOGOUT =====
        function logout() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            isLoggedIn = false;
            firebase.auth().signOut().catch(() => {});
            chatScreen.classList.remove('open');
            loginScreen.classList.remove('hidden');
            passwordInput.value = '';
            messagesContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>Loading messages...</p>
                </div>
            `;
            allMessages = [];
            messageCount.textContent = '0';
            sessionStorage.removeItem('zohrChatLoggedIn');
        }

        // ===== INIT =====
        async function init() {
            const configLoaded = await loadConfig();
            if (!configLoaded) {
                console.error('Failed to load configuration');
                return;
            }

            // Initialize Firebase with config from server
            if (!firebase.apps.length && FIREBASE_CONFIG) {
                firebase.initializeApp(FIREBASE_CONFIG);
            }

            // Check for existing session
            if (sessionStorage.getItem('zohrChatLoggedIn') === 'true') {
                loginScreen.classList.add('hidden');
                chatScreen.classList.add('open');
                isLoggedIn = true;
                try {
                    await firebase.auth().signInAnonymously();
                    listenMessages();
                } catch (error) {
                    console.error('Auth error:', error);
                    listenMessages();
                }
            }

            // Event listeners
            loginBtn.addEventListener('click', login);
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') login();
            });

            logoutBtn.addEventListener('click', logout);
            refreshBtn.addEventListener('click', async () => {
                if (isLoggedIn) {
                    const messages = await fetchMessages();
                    allMessages = messages;
                    renderMessages(messages);
                    showToast('Refreshed');
                }
            });

            console.log('📱 Secure chat loaded');
            console.log('🔒 Firebase config is hidden (loaded from server)');
            console.log('🔒 Password is hashed (not stored in plain text)');
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
